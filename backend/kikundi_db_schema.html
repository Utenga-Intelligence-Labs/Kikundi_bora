
<style>
#erd { padding: 1rem 0; }
#erd svg { width: 100%; height: auto; }
</style>
<h2 class="sr-only">Database schema for Kikundi cha Kuweka na Kukopa — five tables: users, members, contributions, loans, repayments</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a28' : '#f0eee6',
    primaryBorderColor: dark ? '#5a5a56' : '#b4b2a9',
    attributeBackgroundColorEven: dark ? '#232321' : '#f8f7f3',
    attributeBackgroundColorOdd: dark ? '#1e1e1c' : '#ffffff',
  },
});

const diagram = `erDiagram
  users {
    bigint id PK
    varchar name
    varchar email
    varchar password
    enum role "chair|treasurer|secretary"
    boolean is_active
    timestamp created_at
  }

  members {
    bigint id PK
    varchar member_no "unique"
    varchar full_name
    varchar phone "unique"
    text address
    date joined_at
    boolean is_active
    timestamp created_at
  }

  contributions {
    bigint id PK
    bigint member_id FK
    bigint recorded_by FK
    decimal amount
    date month "YYYY-MM-01"
    date paid_at
    text notes
    timestamp created_at
  }

  loans {
    bigint id PK
    bigint member_id FK
    bigint reviewed_by FK
    decimal amount
    decimal approved_amount
    decimal balance_remaining
    text purpose
    date due_date
    enum status "PENDING|OUTSTANDING|CLOSED|REJECTED"
    timestamp applied_at
    timestamp reviewed_at
    text rejection_reason
    timestamp updated_at
  }

  repayments {
    bigint id PK
    bigint loan_id FK
    bigint member_id FK
    bigint recorded_by FK
    decimal amount
    decimal balance_after
    date paid_at
    text notes
    timestamp created_at
  }

  members ||--o{ contributions : "ana michango"
  members ||--o{ loans : "anaomba mikopo"
  members ||--o{ repayments : "analipa marejesho"
  loans   ||--o{ repayments : "ina marejesho"
  users   ||--o{ contributions : "anarekodia"
  users   ||--o{ loans : "anaidhinisha"
  users   ||--o{ repayments : "anarekodia"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
