# =============================================================================
# Kikundi Bora — host Nginx reverse proxy template (kikundi-test.ditronics.co.tz)
#
# IMPORTANT (port change 5050/5051): the Docker stack publishes its services on
#   backend  -> 127.0.0.1:5050
#   frontend -> 127.0.0.1:5051
# The host Nginx must be updated to match (previously 8081 SPA / 8080 API):
#   1. Copy this file to /etc/nginx/sites-available/kikundi (or edit the
#      existing site config in place).
#   2. Replace every 127.0.0.1:8081 with 127.0.0.1:5051 and every
#      127.0.0.1:8080 (the SPA/API upstreams, NOT any postgres) with
#      127.0.0.1:5050.
#   3. nginx -t && systemctl reload nginx
#
# Deploy order on the VPS: update Nginx FIRST or together with the container
# restart — pointing at the old ports after the change breaks the subdomain.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name kikundi-test.ditronics.co.tz;

    # Redirect all HTTP to HTTPS (certbot manages the certificate)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kikundi-test.ditronics.co.tz;

    # certbot-managed certificate paths (adjust to your issuance)
    ssl_certificate     /etc/letsencrypt/live/kikundi-test.ditronics.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kikundi-test.ditronics.co.tz/privkey.pem;

    # ---- API (Go backend, 127.0.0.1:5050 on the host) ----
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10m;
    }

    # Uploaded files are served by the SPA container under /uploads via the
    # frontend's proxy — nothing extra needed here.

    # ---- SPA (frontend container, 127.0.0.1:5051 on the host) ----
    location / {
        proxy_pass http://127.0.0.1:5051;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
